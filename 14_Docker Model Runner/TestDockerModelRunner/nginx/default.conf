upstream orallink_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://orallink_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Docker Model Runner can take minutes to load a model on first use,
        # and /api/ask/stream holds the connection open while the model
        # streams tokens back — keep long timeouts and disable buffering so
        # SSE events reach the client as they arrive instead of being held
        # until the response closes.
        proxy_read_timeout 910s;
        proxy_send_timeout 910s;
        proxy_buffering off;
        proxy_cache off;
    }
}
