<!DOCTYPE html>
<html>
<head>
  <title>Web Translator (Frontend + Backend)</title>
</head>
<body>
  <h2>🌐 Web Translator</h2>
  <textarea id="sourceText" placeholder="Enter text here..."></textarea><br><br>
  <label for="targetLang">Select target language:</label>
  <select id="targetLang">
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh-cn">Chinese</option>
  </select>
  <button onclick="translateText()">Translate</button>

  <h3>Source Text:</h3>
  <p id="sourceOutput"></p>

  <h3>Translated Text:</h3>
  <p id="translatedOutput"></p>
  <button onclick="readAloud()">🔊 Read Aloud</button>

  <script>
    async function translateText() {
      let text = document.getElementById("sourceText").value;
      let targetLang = document.getElementById("targetLang").value;

      let response = await fetch("http://localhost:5000/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, target: targetLang })
      });

      let data = await response.json();

      document.getElementById("sourceOutput").innerText =
        data.source_text + " (" + data.source_lang + ")";
      document.getElementById("translatedOutput").innerText =
        data.translated_text;
    }

    function readAloud() {
      let text = document.getElementById("translatedOutput").innerText;
      let speech = new SpeechSynthesisUtterance(text);
      speech.lang = document.getElementById("targetLang").value;
      window.speechSynthesis.speak(speech);
    }
  </script>
</body>
</html>
