<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Web Translator</h1>

    <form id="translate-form" novalidate>
      <div class="field">
        <label for="source-text">Text to translate</label>
        <textarea
          id="source-text"
          name="text"
          rows="6"
          placeholder="Type or paste text here..."
        ></textarea>
      </div>

      <div class="field">
        <label for="target-language">Translate to</label>
        <select id="target-language" name="targetLanguage">
          <option value="">Select a language</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="nl">Dutch</option>
          <option value="ru">Russian</option>
          <option value="zh-cn">Chinese (Simplified)</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="ar">Arabic</option>
          <option value="hi">Hindi</option>
          <option value="vi">Vietnamese</option>
          <option value="th">Thai</option>
          <option value="id">Indonesian</option>
          <option value="ms">Malay</option>
          <option value="tr">Turkish</option>
          <option value="pl">Polish</option>
          <option value="sv">Swedish</option>
        </select>
      </div>

      <p id="validation-message" class="message error-message" role="alert" hidden></p>

      <button type="submit" id="translate-button" disabled>Translate</button>
      <span id="loading-indicator" class="loading" hidden>Translating…</span>
    </form>

    <section id="result-section" class="result" hidden>
      <h2>Result</h2>
      <p><strong>Source text:</strong> <span id="result-source-text"></span></p>
      <p><strong>Detected language:</strong> <span id="result-detected-language"></span></p>
      <p><strong>Translation:</strong> <span id="result-translated-text"></span></p>
      <button type="button" id="read-aloud-button" hidden>&#128266; Read aloud</button>
      <p id="read-aloud-error" class="message error-message" role="alert" hidden></p>
    </section>

    <p id="error-message" class="message error-message" role="alert" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
