services:
  app:
    image: orallink-rag:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # model-runner.docker.internal only resolves on Docker Desktop.
      # Confirmed on a real g6.xlarge/Ubuntu EC2 instance that it does NOT
      # resolve there — use host.docker.internal + extra_hosts instead.
      # - DMR_BASE_URL=http://model-runner.docker.internal/engines/v1
      - DMR_BASE_URL=http://host.docker.internal:12434/engines/v1
      # Qwen SEA-LION v4 32B — better fit for OralLink's Southeast Asian
      # audience than gpt-oss, but ~32B params is noticeably slower than
      # gpt-oss-20b. Only load-tested on Docker Desktop (CPU, ~0.34 tok/s —
      # unusable for interactive use); re-verify real throughput on the
      # EC2 GPU instance itself before relying on this in production.
      - DMR_MODEL=huggingface.co/mradermacher/qwen-sea-lion-v4-32b-it-gguf:Q4_K_M
      - RAG_TOP_K=4
      - RAG_MAX_TOKENS=800
      - REASONING_EFFORT=low
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
